<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 style="text-align: center; color: #444;">Image Gallery</h1>
    <div class="gallery">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="Gourmet Pasta Dish">
            <div class="card-title">Gourmet Pasta Dish</div>
            <div class="card-caption">A delicious plate of creamy pasta topped with fresh herbs and parmesan.</div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ca4b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="Fresh Garden Salad">
            <div class="card-title">Fresh Garden Salad</div>
            <div class="card-caption">A vibrant salad with mixed greens, cherry tomatoes, and a light vinaigrette.</div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="Chocolate Cake">
            <div class="card-title">Decadent Chocolate Cake</div>
            <div class="card-caption">A rich, moist chocolate cake with a velvety ganache frosting.</div>
        </div>
    </div>
</body>
</html>
