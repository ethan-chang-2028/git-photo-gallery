<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-title {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #444;">Image Gallery</h1>
    <div class="gallery">
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+1" alt="Placeholder">
            <div class="card-title">Nature</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+2" alt="Placeholder">
            <div class="card-title">Mountain</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+3" alt="Placeholder">
            <div class="card-title">Ocean</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+4" alt="Placeholder">
            <div class="card-title">Forest</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+5" alt="Placeholder">
            <div class="card-title">Sunset</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+6" alt="Placeholder">
            <div class="card-title">Wildlife</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+7" alt="Placeholder">
            <div class="card-title">Landscape</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+8" alt="Placeholder">
            <div class="card-title">Adventure</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+9" alt="Placeholder">
            <div class="card-title">Travel</div>
        </div>
    </div>
</body>
</html>
